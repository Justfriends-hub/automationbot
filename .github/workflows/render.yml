name: Render Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic'
        required: true
        default: 'Why interest rates affect everyday prices'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg and imagemagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone MoneyPrinterTurbo
        run: git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git mpt

      - name: Install dependencies
        working-directory: mpt
        run: pip install -r requirements.txt

      - name: Build config.toml
        working-directory: mpt
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cp config.example.toml config.toml
          python3 - <<'PY'
          import re, os

          with open("config.toml") as f:
              c = f.read()

          gemini_key = os.environ["GEMINI_KEY"]
          pexels_key = os.environ["PEXELS_KEY"]

          # Force these regardless of whatever the current default happens to be
          c = re.sub(r'^llm_provider\s*=.*$', 'llm_provider = "gemini"', c, flags=re.M)
          c = re.sub(r'^gemini_api_key\s*=.*$', f'gemini_api_key = "{gemini_key}"', c, flags=re.M)
          c = re.sub(r'^pexels_api_keys\s*=.*$', f'pexels_api_keys = ["{pexels_key}"]', c, flags=re.M)

          with open("config.toml", "w") as f:
              f.write(c)

          # Sanity check: fail fast in logs if something didn't stick
          assert 'llm_provider = "gemini"' in c
          assert gemini_key in c
          assert pexels_key in c
          print("config.toml patched OK")
          PY

      - name: Generate video
        working-directory: mpt
        run: python cli.py --video-subject "${{ github.event.inputs.topic }}"

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: mpt/storage/tasks/**/*.mp4
          retention-days: 7
